// Android side of modules/vision-ocr (phase 1 of docs/android-port-plan.md).
// Everything runs on the device: no Google Play Services feature, no network.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.visionocr'
version = '1.0.0'

android {
  namespace "expo.modules.visionocr"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
  buildFeatures {
    buildConfig true
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // Latin text recognition with the model BUNDLED in the APK. (The
  // play-services-mlkit-* artifacts download their model through Play
  // Services instead: never use those here.)
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // Language identification, bundled model (not play-services-mlkit-language-id).
  implementation 'com.google.mlkit:language-id:17.0.6'
  // Arabic text recognition: Tesseract 5 (Apache-2.0) with tessdata_fast
  // ara.traineddata in src/main/assets/tessdata. Published on JitPack only
  // (the root project lists https://www.jitpack.io).
  implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android-openmp:4.8.0'
  implementation 'androidx.exifinterface:exifinterface:1.4.1'
  // Document camera (DocumentCameraView.kt): the same CameraX version as
  // expo-camera, so the app carries one copy. Page detection is our own
  // Kotlin (PageDetector.kt): no OpenCV, nothing downloaded.
  def camerax_version = '1.5.0-rc01'
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  // PDF reading (phase 3). Rendering: PDFium through PdfiumAndroidKt
  // (Apache-2.0; PDFium itself BSD-3), which draws annotations and form
  // fields (Android's PdfRenderer before API 35 draws neither) and opens
  // encrypted files. 1.0.35 is the newest release built with Kotlin 2.2
  // metadata (2.x needs a Kotlin 2.3+ compiler; the app builds with 2.1).
  // Its Guava dependency only backs page-cache helpers we don't use.
  implementation('io.legere:pdfiumandroid:1.0.35') {
    exclude group: 'com.google.guava', module: 'guava'
  }
  // Structure, passwords and permissions (PdfBox-Android, Apache-2.0).
  // BouncyCastle is only needed for public-key (certificate) encryption,
  // which Scan Kit doesn't open; the standard password handler uses the
  // platform's own crypto.
  implementation('com.tom-roush:pdfbox-android:2.0.27.0') {
    exclude group: 'org.bouncycastle'
  }

  testImplementation 'junit:junit:4.13.2'
}
